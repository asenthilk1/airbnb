version: 2

models:
  - name: dim_listing_cleansed
    columns:

      - name: listing_id
        tests:
          - unique
          - not_null

      - name: host_id
        tests:
          - not_null
          - relationships:
              field: host_id
              to: ref('dim_hosts_cleansed')


      - name: room_type
        tests:
         - accepted_values:
             values: ['Entire home/apt',
                      'Private room',
                      'Shared room',
                      'Hotel room']

      - name: dim_listings_w_hosts
        tests:
          - dbt_expectations.expect_table_row_count_to_equal_other_table:
              compare_model:source('airbnb','listings')